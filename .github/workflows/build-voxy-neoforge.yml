name: Build Voxy NeoForge 1.21.1

on:
  push:
    branches: ['arena/94d4d401-mod']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr50-sodium08
            repo: dontflipmybits/voxy-neoforge
            ref: MC1.21.1-NeoForge21.1.228-Sodium-0.8.12
            desc: "PR #50 (NeoForge 21.1.228 + Sodium 0.8.12+)"
          - name: pr51-sodium08-compat
            repo: VoX/voxy-neoforge
            ref: sodium-0.8-compat
            desc: "PR #51 (Sodium 0.8 support alongside 0.6.13)"
          - name: compilefix-sodium0613
            repo: NormalCortisolLevels/Voxy-NeoForge-Compile-Fix
            ref: 'neoforge-1.21.1-(compile-fixes)'
            desc: "Compile-fix fork (Sodium 0.6.13 only)"
    steps:
      - name: Checkout Voxy sources
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: voxy

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle build
        working-directory: voxy
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain --stacktrace
        env:
          GITHUB_ACTIONS: true

      - name: Show built jars
        run: |
          ls -l voxy/build/libs
          sha256sum voxy/build/libs/*.jar

      - name: Publish jars as a DRAFT release (not public until published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Variant: ${{ matrix.name }}"
            echo "Source: ${{ matrix.repo }} @ ${{ matrix.ref }} - ${{ matrix.desc }}"
            echo "JDK 21, Minecraft 1.21.1."
            echo ""
            echo "pr50 / pr51 variants target Sodium 0.8.x on NeoForge."
            echo "compilefix variant targets Sodium 0.6.13-neoforge only."
            echo "Also needs Forgified Fabric API (0.116.7+2.2.0+1.21.1 or newer)."
            echo "Install: put the voxy-*.jar (without -sources/-dev suffix) into the instance mods folder."
            echo ""
            echo "Voxy is All Rights Reserved by MCRcortex. Private personal build: delete the draft after downloading."
          } > notes.md
          gh release create "voxy-${{ matrix.name }}-${GITHUB_RUN_ID}" voxy/build/libs/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Voxy NeoForge 1.21.1 - ${{ matrix.name }} (DRAFT)" \
            --notes-file notes.md
