name: Build Voxy NeoForge 1.21.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Voxy sources (PR #45 head)
        uses: actions/checkout@v4
        with:
          repository: j-shelfwood/voxy-neoforge
          ref: refs/pull/45/head
          path: voxy

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve Sodium + Iris jars into libs/
        working-directory: voxy
        run: |
          set -e
          mkdir -p libs
          exec > >(tee /tmp/probe.log) 2>&1
          has_cls() { unzip -l "$1" 2>/dev/null | grep -c 'net/caffeinemc/mods/sodium/client/gl/shader/ShaderParser.class' || true; }

          SOD_JSON=$(curl -sG 'https://api.modrinth.com/v2/project/sodium/version' \
            --data-urlencode 'game_versions=["1.21.1"]' --data-urlencode 'loaders=["neoforge"]')
          SOD_URL=$(echo "$SOD_JSON" | jq -r '[.[] | select(.version_number|test("0\\.8\\.13"))][0].files[0].url // empty')
          echo "modrinth sodium url: $SOD_URL"
          curl -sL -o /tmp/sodium-modrinth.jar "$SOD_URL"
          echo "outer jar ShaderParser=$(has_cls /tmp/sodium-modrinth.jar)"
          rm -rf /tmp/sodx && mkdir -p /tmp/sodx && (cd /tmp/sodx && unzip -oq /tmp/sodium-modrinth.jar)
          BEST=""
          for cand in $(find /tmp/sodx -name '*.jar' 2>/dev/null) /tmp/sodium-modrinth.jar; do
            c=$(has_cls "$cand"); echo "candidate $cand -> ShaderParser=$c"
            if [ "$c" -gt 0 ] && [ -z "$BEST" ]; then BEST="$cand"; fi
          done
          echo "BEST=$BEST"
          if [ -n "$BEST" ]; then cp "$BEST" 'libs/sodium-neoforge-0.8.12-beta.2-mod.jar'; else cp /tmp/sodium-modrinth.jar 'libs/sodium-neoforge-0.8.12-beta.2-mod.jar'; fi

          IRIS_JSON=$(curl -sG 'https://api.modrinth.com/v2/project/iris/version' \
            --data-urlencode 'game_versions=["1.21.1"]' --data-urlencode 'loaders=["neoforge"]')
          IRIS_URL=$(echo "$IRIS_JSON" | jq -r '[.[] | select(.version_number|test("1\\.8\\.14"))][0].files[0].url // empty')
          echo "iris url: $IRIS_URL"
          curl -sL -o 'libs/iris-neoforge-1.8.14-beta.1.jar' "$IRIS_URL"
          ls -l libs

      - name: Patch Iris pipeline handling (Immersive Portals fix)
        working-directory: voxy
        run: |
          set -e
          cat > /tmp/patch.py <<'PYEOF'
          import io, os, sys

          def patch(path, pairs):
              with io.open(path, encoding='utf-8') as f:
                  src = f.read()
              for old, new in pairs:
                  if old not in src:
                      print('!! PATTERN NOT FOUND in ' + path)
                      print(repr(old))
                      sys.exit(3)
                  src = src.replace(old, new, 1)
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write(src)
              print('patched ' + path)

          base = 'src/main/java/me/cortex/voxy/client/core/'

          old_factory = '''            Logger.info("Creating voxy iris render pipeline");
                      try {
                          return new IrisVoxyRenderPipeline(properties, pipeData, nodeManager, nodeCleaner, traversal, frexSupplier);
                      } catch (Exception e) {
                          Logger.error("Failed to create iris render pipeline", e);
                          IrisUtil.disableIrisShaders();
                          return null;
                      }'''

          new_factory = '''            if (pipeData.thePipeline != null) {
                          Logger.info("Iris pipeline data already bound by another voxy render system (secondary world / portal world switch) - using the normal pipeline for this instance, shaders stay enabled");
                          return null;
                      }
                      Logger.info("Creating voxy iris render pipeline");
                      try {
                          return new IrisVoxyRenderPipeline(properties, pipeData, nodeManager, nodeCleaner, traversal, frexSupplier);
                      } catch (Throwable e) {
                          Logger.error("Failed to create iris render pipeline - keeping shaders ENABLED, falling back to the normal pipeline", e);
                          pipeData.thePipeline = null;
                          return null;
                      }'''

          patch(base + 'RenderPipelineFactory.java', [(old_factory, new_factory)])

          old_field = '''    private final GlBuffer shaderUniforms;'''
          new_field = '''    private final GlBuffer shaderUniforms;
              private boolean voxyIrisPipelineFreed = false;'''

          old_free = '''    @Override
              public void free() {
                  if (this.data.thePipeline != this) {
                      throw new IllegalStateException();
                  }
                  this.data.thePipeline = null;'''

          new_free = '''    @Override
              public void free() {
                  if (this.voxyIrisPipelineFreed) {
                      return;
                  }
                  this.voxyIrisPipelineFreed = true;
                  if (this.data.thePipeline == this) {
                      this.data.thePipeline = null;
                  }'''

          patch(base + 'IrisVoxyRenderPipeline.java', [(old_field, new_field), (old_free, new_free)])

          # 3) MixinIrisRenderingPipeline: inject at HEAD (the activeTexture invoke point
          #    is gone in Iris 1.8.x) and restore the main render target viewport before
          #    applying captured parameters (shadow pass leaves a wrong GL viewport).
          old_begin = '''    @Inject(method = "beginLevelRendering", at = @At(value = "INVOKE", target = "Lcom/mojang/blaze3d/systems/RenderSystem;activeTexture(I)V", shift = At.Shift.BEFORE), remap = false)
              private void voxy$injectViewportSetup(CallbackInfo ci) {
                  if (IrisUtil.CAPTURED_VIEWPORT_PARAMETERS != null) {
                      var renderer = ((IGetVoxyRenderSystem) Minecraft.getInstance().levelRenderer).voxy$getRenderSystem();
                      if (renderer != null) {
                          IrisUtil.CAPTURED_VIEWPORT_PARAMETERS.apply(renderer);
                      }
                  }
              }'''

          new_begin = '''    @Inject(method = "beginLevelRendering", at = @At("HEAD"), remap = false)
              private void voxy$injectViewportSetup(CallbackInfo ci) {
                  if (IrisUtil.CAPTURED_VIEWPORT_PARAMETERS != null) {
                      var renderer = ((IGetVoxyRenderSystem) Minecraft.getInstance().levelRenderer).voxy$getRenderSystem();
                      if (renderer != null) {
                          var rt = Minecraft.getInstance().getMainRenderTarget();
                          org.lwjgl.opengl.GL11C.glViewport(0, 0, rt.width, rt.height);
                          IrisUtil.CAPTURED_VIEWPORT_PARAMETERS.apply(renderer);
                      }
                  }
              }'''

          patch(base + '../mixin/iris/MixinIrisRenderingPipeline.java', [(old_begin, new_begin)])

          # 4) MixinDefaultChunkRenderer: always setupViewport from doRender with the
          #    matrices of the CURRENT render pass (portal views get their own viewport
          #    instead of a stale one captured at renderLevel HEAD).
          old_dorender = '''                Viewport<?> viewport = null;
                          if (IrisUtil.irisShaderPackEnabled()) {
                              viewport = renderer.getViewport();
                          } else {
                              viewport = renderer.setupViewport(matrices.projection(), matrices.modelView(), camera.x, camera.y, camera.z);
                          }'''

          new_dorender = '''                Viewport<?> viewport = renderer.setupViewport(matrices.projection(), matrices.modelView(), camera.x, camera.y, camera.z);'''

          patch(base + '../mixin/sodium/MixinDefaultChunkRenderer.java', [(old_dorender, new_dorender)])

          # 5) ViewportSelector: do not render LOD into Iris shadow/G-buffer targets
          #    during the shadow pass (breaks the shadow map -> sunlight disappears);
          #    renderOpaque(null) is a safe no-op.
          old_shadow = '''        if (viewport == null && IrisUtil.irisShadowActive()) {
                      viewport = this.getOrCreate(IRIS_SHADOW_OBJECT);
                  }'''

          new_shadow = '''        if (viewport == null && IrisUtil.irisShadowActive()) {
                      return null;
                  }'''

          patch(base + 'rendering/ViewportSelector.java', [(old_shadow, new_shadow)])

          # 6) IrisVoxyRenderPipeline.finish(): snapshot/restore GL state. The depth blit
          #    leaves DEPTH_TEST/STENCIL_TEST/depth-func disabled or changed; Immersive
          #    Portals draws its portal quads right after and relies on sane state, so the
          #    leak made portals draw through walls and corrupted scene depth/lighting.
          old_finish = '''    @Override
              protected void finish(Viewport<?> viewport, int sourceFrameBuffer, int srcWidth, int srcHeight) {
                  if (this.data.renderToVanillaDepth && srcWidth == viewport.width  && srcHeight == viewport.height) {//We can only depthblit out if destination size is the same
                      glColorMask(false, false, false, false);
                      AbstractRenderPipeline.transformBlitDepth(this.depthBlit,
                              this.fbTranslucent.getDepthTex().id, sourceFrameBuffer,
                              viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));
                      glColorMask(true, true, true, true);
                  } else {
                      // normally disabled by AbstractRenderPipeline but since we are skipping it we do it here
                      glDisable(GL_STENCIL_TEST);
                      glDisable(GL_DEPTH_TEST);
                  }
              }'''

          new_finish = '''    @Override
              protected void finish(Viewport<?> viewport, int sourceFrameBuffer, int srcWidth, int srcHeight) {
                  int prevDepthFunc = org.lwjgl.opengl.GL11C.glGetInteger(org.lwjgl.opengl.GL11C.GL_DEPTH_FUNC);
                  boolean prevDepthTest = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_DEPTH_TEST);
                  boolean prevStencilTest = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_STENCIL_TEST);
                  boolean prevCullFace = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_CULL_FACE);
                  try {
                      if (this.data.renderToVanillaDepth && srcWidth == viewport.width  && srcHeight == viewport.height) {//We can only depthblit out if destination size is the same
                          glColorMask(false, false, false, false);
                          AbstractRenderPipeline.transformBlitDepth(this.depthBlit,
                                  this.fbTranslucent.getDepthTex().id, sourceFrameBuffer,
                                  viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));
                          glColorMask(true, true, true, true);
                      } else {
                          // normally disabled by AbstractRenderPipeline but since we are skipping it we do it here
                          glDisable(GL_STENCIL_TEST);
                          glDisable(GL_DEPTH_TEST);
                      }
                  } finally {
                      if (prevDepthTest) {
                          glEnable(GL_DEPTH_TEST);
                      } else {
                          glDisable(GL_DEPTH_TEST);
                      }
                      if (prevStencilTest) {
                          glEnable(GL_STENCIL_TEST);
                      } else {
                          glDisable(GL_STENCIL_TEST);
                      }
                      if (prevCullFace) {
                          glEnable(GL_CULL_FACE);
                      } else {
                          glDisable(GL_CULL_FACE);
                      }
                      glDepthFunc(prevDepthFunc);
                  }
              }'''

          patch(base + 'IrisVoxyRenderPipeline.java', [(old_finish, new_finish)])

          # 7) PortalViewGuard + skip LOD draws while Immersive Portals renders a portal
          #    view (the user accepts LOD being invisible through portals).
          guard_path = base + 'util/PortalViewGuard.java'
          guard_src = '''package me.cortex.voxy.client.core.util;

          public class PortalViewGuard {
              private static final java.lang.reflect.Method IS_RENDERING = resolve();

              private static java.lang.reflect.Method resolve() {
                  String[] classNames = {
                          "qouteall.imm_ptl.core.render.context_management.PortalRendering",
                          "qouteall.imm_ptl.core.render.context_management.RenderStates"
                  };
                  String[] methodNames = { "isRendering", "isPortalRendering" };
                  for (String className : classNames) {
                      try {
                          Class<?> clazz = Class.forName(className);
                          for (String methodName : methodNames) {
                              try {
                                  return clazz.getMethod(methodName);
                              } catch (NoSuchMethodException ignored) {
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  return null;
              }

              public static boolean isRenderingPortalView() {
                  if (IS_RENDERING == null) {
                      return false;
                  }
                  try {
                      return (Boolean) IS_RENDERING.invoke(null);
                  } catch (Throwable t) {
                      return false;
                  }
              }
          }
          '''
          os.makedirs(os.path.dirname(guard_path), exist_ok=True)
          with io.open(guard_path, 'w', encoding='utf-8') as f:
              f.write(guard_src)
          print('wrote ' + guard_path)

          # (v5: the portal-view LOD skip from v4 is REVERTED on user request - LOD must
          #  stay visible inside portal views, as it was in v2/v3)

          # 8) build marker so the running jar can be identified from the log
          old_marker = '''        //Note this is where will choose/create e.g. IrisRenderPipeline or normal pipeline
                  AbstractRenderPipeline pipeline = null;'''

          new_marker = '''        Logger.info("arena build marker: iris-ipfix-v5 (conservative depth merge blit)");
                  //Note this is where will choose/create e.g. IrisRenderPipeline or normal pipeline
                  AbstractRenderPipeline pipeline = null;'''

          patch(base + 'RenderPipelineFactory.java', [(old_marker, new_marker)])

          # 9) MixinLevelRenderer: do NOT kill shaders when the render system constructor
          #    throws (second shader-kill path found in voxy$createRenderer catch).
          old_import = '''import net.minecraft.client.multiplayer.ClientLevel;'''
          new_import = '''import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;'''

          old_catch = '''        } catch (RuntimeException e) {
                      if (IrisUtil.irisShaderPackEnabled()) {
                          IrisUtil.disableIrisShaders();
                      } else {
                          throw e;
                      }
                  }'''

          new_catch = '''        } catch (RuntimeException e) {
                      Logger.error("Failed to create voxy render system - keeping shaders ENABLED", e);
                      this.renderer = null;
                  }'''

          mlr = base + '../mixin/minecraft/MixinLevelRenderer.java'
          patch(mlr, [(old_import, new_import), (old_catch, new_catch)])

          # 10) IrisVoxyRenderPipeline.finish(): the depth emit blit inherits whatever depth
          #     func Iris/Eclipse left active (composite passes commonly leave GL_ALWAYS),
          #     which makes it OVERWRITE the whole scene depth with LOD depth -> portals draw
          #     through walls and fog/lighting smears. Force the conservative closer-equal
          #     compare so the blit only fills pixels where LOD is in front of what is there.
          old_blit = '''                glColorMask(false, false, false, false);
                          AbstractRenderPipeline.transformBlitDepth(this.depthBlit,
                                  this.fbTranslucent.getDepthTex().id, sourceFrameBuffer,
                                  viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));
                          glColorMask(true, true, true, true);'''

          new_blit = '''                glColorMask(false, false, false, false);
                          glDepthFunc(this.properties.closerEqualDepthCompare());
                          AbstractRenderPipeline.transformBlitDepth(this.depthBlit,
                                  this.fbTranslucent.getDepthTex().id, sourceFrameBuffer,
                                  viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));
                          glColorMask(true, true, true, true);'''

          patch(base + 'IrisVoxyRenderPipeline.java', [(old_blit, new_blit)])

          # ================= v6: deferred Iris composite (smear / TAA / double lighting fix) ====
          # Under Iris shader packs the LOD colour must NOT travel through Iris's deferred
          # passes: Voxy's patched G-buffer writes do not match what packs like Eclipse
          # expect (normals/velocity/SSAO input), which shows up as black smeared LOD with
          # ghost trails on unloaded chunks. Both pipelines now defer their blit and
          # composite colour+depth onto the main framebuffer AFTER Iris composites.
          ivrp = base + 'IrisVoxyRenderPipeline.java'

          patch(ivrp, [(
              "    private final GlBuffer shaderUniforms;\n    private boolean voxyIrisPipelineFreed = false;",
              "    private final GlBuffer shaderUniforms;\n    private boolean voxyIrisPipelineFreed = false;\n    private boolean hasDeferredIrisBlit = false;\n    private Viewport<?> deferredIrisViewport = null;\n    private final FullscreenBlit compositeBlit;\n    private me.cortex.voxy.client.core.gl.GlTexture opaqueColourTex;\n    private me.cortex.voxy.client.core.gl.GlTexture translucentColourTex;"
          ), (
              "        this.depthBlit = new FullscreenBlit(properties, \"voxy:post/blit_texture_depth_cutout.frag\");",
              "        this.depthBlit = new FullscreenBlit(properties, \"voxy:post/blit_texture_depth_cutout.frag\");\n        this.compositeBlit = new FullscreenBlit(properties, \"voxy:post/blit_texture_depth_cutout.frag\",\n                a -> a.define(\"EMIT_COLOUR\"));"
          ), (
              "        this.fb.resize(viewport.width, viewport.height);\n        this.fbTranslucent.resize(viewport.width, viewport.height);",
              "        this.fb.resize(viewport.width, viewport.height);\n        this.fbTranslucent.resize(viewport.width, viewport.height);\n        this.ensureOwnColourTargets(viewport.width, viewport.height);"
          ), (
              "        boolean prevCullFace = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_CULL_FACE);\n        try {",
              "        boolean prevCullFace = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_CULL_FACE);\n        if (me.cortex.voxy.client.core.util.IrisUtil.IRIS_INSTALLED && me.cortex.voxy.client.core.util.IrisUtil.irisShaderPackEnabled()) {\n            // v6: do not feed LOD colour/depth into Iris's deferred passes (double lighting,\n            // wrong normals, TAA ghost trails, SSAO/GI garbage on LOD pixels). The composite\n            // happens after Iris composites, in postIrisComposite().\n            org.lwjgl.opengl.GL11C.glDisable(org.lwjgl.opengl.GL11C.GL_STENCIL_TEST);\n            glBindFramebuffer(GL_FRAMEBUFFER, sourceFrameBuffer);\n            this.hasDeferredIrisBlit = true;\n            this.deferredIrisViewport = viewport;\n            return;\n        }\n        try {"
          ), (
              "    @Override\n    public void setupAndBindOpaque(Viewport<?> viewport) {\n        this.fb.bind();\n        this.doBindings();\n    }",
              "    private void ensureOwnColourTargets(int width, int height) {\n        if (this.opaqueColourTex != null && this.opaqueColourTex.getWidth() == width && this.opaqueColourTex.getHeight() == height) {\n            return;\n        }\n        if (this.opaqueColourTex != null) {\n            this.opaqueColourTex.free();\n            this.translucentColourTex.free();\n        }\n        this.opaqueColourTex = new me.cortex.voxy.client.core.gl.GlTexture().store(org.lwjgl.opengl.GL11C.GL_RGBA8, 1, width, height);\n        this.translucentColourTex = new me.cortex.voxy.client.core.gl.GlTexture().store(org.lwjgl.opengl.GL11C.GL_RGBA8, 1, width, height);\n        glNamedFramebufferTexture(this.fb.framebuffer.id, GL30.GL_COLOR_ATTACHMENT0, this.opaqueColourTex.id, 0);\n        glNamedFramebufferDrawBuffers(this.fb.framebuffer.id, GL30.GL_COLOR_ATTACHMENT0);\n        glNamedFramebufferTexture(this.fbTranslucent.framebuffer.id, GL30.GL_COLOR_ATTACHMENT0, this.translucentColourTex.id, 0);\n        glNamedFramebufferDrawBuffers(this.fbTranslucent.framebuffer.id, GL30.GL_COLOR_ATTACHMENT0);\n        glTextureParameterf(this.opaqueColourTex.id, org.lwjgl.opengl.GL11C.GL_TEXTURE_MIN_FILTER, GL_NEAREST);\n        glTextureParameterf(this.opaqueColourTex.id, org.lwjgl.opengl.GL11C.GL_TEXTURE_MAG_FILTER, GL_NEAREST);\n        glTextureParameterf(this.translucentColourTex.id, org.lwjgl.opengl.GL11C.GL_TEXTURE_MIN_FILTER, GL_NEAREST);\n        glTextureParameterf(this.translucentColourTex.id, org.lwjgl.opengl.GL11C.GL_TEXTURE_MAG_FILTER, GL_NEAREST);\n        this.fb.framebuffer.verify();\n        this.fbTranslucent.framebuffer.verify();\n    }\n\n    @Override\n    public void postIrisComposite(int mainFB, int srcWidth, int srcHeight) {\n        if (!this.hasDeferredIrisBlit || this.deferredIrisViewport == null || this.opaqueColourTex == null) {\n            return;\n        }\n        var viewport = this.deferredIrisViewport;\n        this.hasDeferredIrisBlit = false;\n        this.deferredIrisViewport = null;\n\n        this.compositeBlit.bind();\n        glBindTextureUnit(3, this.opaqueColourTex.id);\n        org.lwjgl.opengl.GL11C.glEnable(org.lwjgl.opengl.GL11C.GL_BLEND);\n        org.lwjgl.opengl.GL14C.glBlendFuncSeparate(org.lwjgl.opengl.GL11C.GL_SRC_ALPHA, org.lwjgl.opengl.GL11C.GL_ONE_MINUS_SRC_ALPHA, org.lwjgl.opengl.GL11C.GL_ONE, org.lwjgl.opengl.GL11C.GL_ONE_MINUS_SRC_ALPHA);\n        AbstractRenderPipeline.transformBlitDepth(this.compositeBlit, this.fbTranslucent.getDepthTex().id, mainFB,\n                viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));\n        org.lwjgl.opengl.GL11C.glDisable(org.lwjgl.opengl.GL11C.GL_BLEND);\n        org.lwjgl.opengl.GL20C.glUseProgram(0);\n        org.lwjgl.opengl.GL11C.glEnable(org.lwjgl.opengl.GL11C.GL_DEPTH_TEST);\n    }\n\n    @Override\n    public void setupAndBindOpaque(Viewport<?> viewport) {\n        this.fb.bind();\n        this.doBindings();\n    }"
          ), (
              "        this.depthBlit.delete();\n        this.fbTranslucent.free();",
              "        this.depthBlit.delete();\n        this.compositeBlit.delete();\n        if (this.opaqueColourTex != null) {\n            this.opaqueColourTex.free();\n            this.translucentColourTex.free();\n        }\n        this.fbTranslucent.free();"
          )])

          nrp = base + 'NormalRenderPipeline.java'
          patch(nrp, [(
              "import me.cortex.voxy.client.core.gl.GlFramebuffer;",
              "import me.cortex.voxy.client.core.gl.GlFramebuffer;\nimport me.cortex.voxy.client.core.util.IrisUtil;"
          ), (
              "    private final SSAO ssao;",
              "    private final SSAO ssao;\n\n    // v6: deferred Iris composite state\n    private boolean hasDeferredIrisBlit = false;\n    private Viewport<?> deferredIrisViewport = null;\n    private boolean skipSsaoThisFrame = false;"
          ), (
              "    protected void postOpaquePreTranslucent(Viewport<?> viewport, int sourceFrameBuffer) {\n        GPUTiming.INSTANCE.marker(\"ao\");",
              "    protected void postOpaquePreTranslucent(Viewport<?> viewport, int sourceFrameBuffer) {\n        if (IrisUtil.IRIS_INSTALLED && IrisUtil.irisShaderPackEnabled()) {\n            // v6: SSAO under Iris uses the Iris-modified MVP (different near/far) and\n            // over-darkens LOD geometry; packs then tint those pixels. Skip it.\n            this.skipSsaoThisFrame = true;\n            glBindFramebuffer(GL_FRAMEBUFFER, this.fbSSAO.id);\n            return;\n        }\n        this.skipSsaoThisFrame = false;\n        GPUTiming.INSTANCE.marker(\"ao\");"
          ), (
              "    protected void finish(Viewport<?> viewport, int sourceFrameBuffer, int srcWidth, int srcHeight) {\n        this.finalBlit.bind();",
              "    protected void finish(Viewport<?> viewport, int sourceFrameBuffer, int srcWidth, int srcHeight) {\n        if (IrisUtil.IRIS_INSTALLED && IrisUtil.irisShaderPackEnabled()) {\n            // v6: blitting already-lit LOD colour into Iris's G-buffer makes Iris light it a\n            // second time and leaves TAA trails; defer to postIrisComposite() instead.\n            glDisable(GL_STENCIL_TEST);\n            glBindFramebuffer(GL_FRAMEBUFFER, sourceFrameBuffer);\n            this.hasDeferredIrisBlit = true;\n            this.deferredIrisViewport = viewport;\n            return;\n        }\n        this.finalBlit.bind();"
          ), (
              "    @Override\n    public void setupAndBindOpaque(Viewport<?> viewport) {\n        this.fb.bind();\n    }",
              "    @Override\n    public void postIrisComposite(int mainFB, int srcWidth, int srcHeight) {\n        if (!this.hasDeferredIrisBlit || this.deferredIrisViewport == null) {\n            return;\n        }\n        var viewport = this.deferredIrisViewport;\n        this.hasDeferredIrisBlit = false;\n        this.deferredIrisViewport = null;\n\n        this.finalBlit.bind();\n        if (this.useEnvFog) {\n            glUniform2f(4, 0, 0);\n            glUniform4f(5, 0, 0, 0, 0);\n            glUniform1i(6, 0);\n            glUniform1f(7, 0);\n            glUniform1f(8, 0);\n        }\n        glBindTextureUnit(3, this.skipSsaoThisFrame ? this.colourTex.id : this.colourSSAOTex.id);\n        glEnable(GL_BLEND);\n        glBlendFuncSeparate(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA, GL_ONE, GL_ONE_MINUS_SRC_ALPHA);\n        AbstractRenderPipeline.transformBlitDepth(this.finalBlit, this.fb.getDepthTex().id, mainFB,\n                viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));\n        glDisable(GL_BLEND);\n        org.lwjgl.opengl.GL20C.glUseProgram(0);\n        glEnable(GL_DEPTH_TEST);\n    }\n\n    @Override\n    public void setupAndBindOpaque(Viewport<?> viewport) {\n        this.fb.bind();\n    }"
          )])

          patch(base + 'AbstractRenderPipeline.java', [(
              "    public abstract void setupAndBindOpaque(Viewport<?> viewport);",
              "    /**\n     * v6: called after Iris finalizeLevelRendering() (after all composite passes).\n     * Pipelines that deferred their LOD blit composite colour+depth onto the main\n     * framebuffer here, bypassing Iris's deferred lighting/TAA/SSAO for LOD pixels.\n     */\n    public void postIrisComposite(int mainFB, int srcWidth, int srcHeight) {}\n\n    public abstract void setupAndBindOpaque(Viewport<?> viewport);"
          )])

          vrs = base + 'VoxyRenderSystem.java'
          patch(vrs, [(
              "    private final AbstractRenderPipeline pipeline;",
              "    private final AbstractRenderPipeline pipeline;\n\n    // v6: live render systems, so the Iris finalize hook can composite every world\n    // (main + Immersive Portals secondary/portal worlds).\n    public static final java.util.List<VoxyRenderSystem> INSTANCES = new java.util.concurrent.CopyOnWriteArrayList<>();"
          ), (
              "            this.pipeline = RenderPipelineFactory.createPipeline(this.properties, this.nodeManager, this.nodeCleaner, this.traversal, this::frexStillHasWork);",
              "            this.pipeline = RenderPipelineFactory.createPipeline(this.properties, this.nodeManager, this.nodeCleaner, this.traversal, this::frexStillHasWork);\n            INSTANCES.add(this);"
          ), (
              "    public void shutdown() {",
              "    /**\n     * v6: called from MixinIrisRenderingPipeline after Iris finalizeLevelRendering().\n     */\n    public void postIrisComposite() {\n        if (this.pipeline == null) {\n            return;\n        }\n        var mainTarget = net.minecraft.client.Minecraft.getInstance().getMainRenderTarget();\n        this.pipeline.postIrisComposite(mainTarget.frameBufferId, mainTarget.width, mainTarget.height);\n    }\n\n    public void shutdown() {\n        INSTANCES.remove(this);"
          )])

          patch(base + '../mixin/iris/MixinIrisRenderingPipeline.java', [(
              "    @Override\n    public IrisShaderPatch voxy$getPatchData() {",
              "    @Inject(method = \"finalizeLevelRendering\", at = @At(\"RETURN\"), remap = false)\n    private void voxy$injectPostComposite(CallbackInfo ci) {\n        for (var renderer : me.cortex.voxy.client.core.VoxyRenderSystem.INSTANCES) {\n            renderer.postIrisComposite();\n        }\n    }\n\n    @Override\n    public IrisShaderPatch voxy$getPatchData() {"
          )])

          patch(base + 'RenderPipelineFactory.java', [(
              "        Logger.info(\"arena build marker: iris-ipfix-v5 (conservative depth merge blit)\");",
              "        Logger.info(\"arena build marker: iris-ipfix-v6 (deferred iris composite, ssao skip)\");"
          )])
          PYEOF
          python3 /tmp/patch.py
          echo "=== diff ==="
          git --no-pager diff --stat
          git --no-pager diff | tee /tmp/patch.diff | head -120

      - name: Gradle build (capture log)
        working-directory: voxy
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          echo "gradle exit code: $code"

      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "gradle exit: ${{ env.GRADLE_EXIT }}"
            echo ""
            echo "== applied patch =="
            echo '```diff'
            head -c 20000 /tmp/patch.diff
            echo '```'
            echo ""
            echo "== compile errors =="
            echo '```'
            grep -aE "error:|FAILURE|What went wrong|Execution failed|Could not resolve|> Task .* FAILED" /tmp/build.log | head -40
            echo '```'
            echo ""
            echo "== probe (libs/) =="
            echo '```'
            head -c 4000 /tmp/probe.log
            echo '```'
          } > notes.md
          if [ "${{ env.GRADLE_EXIT }}" = "0" ]; then
            ls -l voxy/build/libs
            sha256sum voxy/build/libs/*.jar | tee /tmp/sha.txt
            printf '\n== checksums ==\n```\n' >> notes.md
            cat /tmp/sha.txt >> notes.md
            printf '```\n' >> notes.md
            gh release create "voxy-pr45-iris-ipfix-${GITHUB_RUN_ID}" voxy/build/libs/*.jar \
              --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Voxy 0.2.15-beta NeoForge + Iris (IP fix) (DRAFT)" --notes-file notes.md
          else
            gh release create "voxy-buildlog-ipfix-${GITHUB_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" --draft \
              --title "BUILDLOG ipfix (DRAFT)" --notes-file notes.md
          fi

  build-ipfix:
    name: IPL Copy Fix (companion, IP x Iris framebuffer copies)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build companion mod (log always captured)
        working-directory: ipl-copy-fix
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/ipfix-build.log
          echo "===== build/libs =====" | tee -a /tmp/ipfix-build.log
          ls -la build/libs 2>&1 | tee -a /tmp/ipfix-build.log

      - name: Upload jar as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipl-copy-fix-jar
          path: ipl-copy-fix/build/libs/*.jar
          if-no-files-found: warn

      - name: Publish release with jar and build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ls -la ipl-copy-fix/build/libs || true
          JAR=$(ls ipl-copy-fix/build/libs/*.jar 2>/dev/null | grep -v sources | head -1 || true)
          echo "JAR=$JAR"

          # drop stale drafts from earlier attempts
          for RID in $(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${GITHUB_API_URL}/repos/${{ github.repository }}/releases?per_page=100" \
              | jq -r '.[] | select(.draft==true) | select(.name | test("ipl-copy-fix")) | .id'); do
            curl -sL -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "${GITHUB_API_URL}/repos/${{ github.repository }}/releases/$RID" || true
          done

          TAG=ipl-copy-fix-1.0.0
          {
            echo "arena build marker: ipl-copy-fix-1.0.0"
            echo "run: ${{ github.run_id }}  commit: ${{ github.sha }}"
            echo
            echo "Client-only companion mod for Immersive Portals x Iris on NeoForge 1.21.1."
            echo "Reroutes IPIrisHelper.newCopyDepthStencil / copyDepthStencil / copyColor:"
            echo "  color -> glBlitNamedFramebuffer (legal cross-format conversion)"
            echo "  depth -> blit when internal formats match, fullscreen gl_FragDepth pass when they differ"
            echo
            echo "Fixes the thousands of per-frame GL_INVALID_OPERATION"
            echo "'source and destination internal formats are not compatible' errors that make portals"
            echo "render without depth (visible through walls) and break lighting around them when an"
            echo "Iris shader pack (Eclipse) replaces the main framebuffer attachments."
            echo
            echo "#### build log (tail)"
            echo '```'
            tail -n 120 /tmp/ipfix-build.log 2>/dev/null || echo "no log"
            echo '```'
          } > notes.md

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          if [ -n "$JAR" ]; then
            gh release create "$TAG" "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ipl-copy-fix 1.0.0 (IP x Iris framebuffer copy shim)" \
              --notes-file notes.md \
              --prerelease
            echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$JAR")"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ipl-copy-fix 1.0.0 BUILD FAILED" --notes-file notes.md --prerelease || true
            echo "NO JAR PRODUCED"
            exit 1
          fi
