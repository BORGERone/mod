name: Build Voxy NeoForge 1.21.1

on:
  push:
    branches: ['arena/94d4d401-mod']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr45-sodium0812-iris
            repo: j-shelfwood/voxy-neoforge
            ref: refs/pull/45/head
            desc: "PR #45: voxy 0.2.15-beta + Sodium 0.8.12 + Iris 1.8.14"
    steps:
      - name: Checkout Voxy sources
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: voxy

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle build (capture log, do not fail job yet)
        working-directory: voxy
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          echo "gradle exit code: $code"

      - name: Publish BUILD LOG as draft release (on failure)
        if: env.GRADLE_EXIT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "BUILD FAILED (gradle exit ${{ env.GRADLE_EXIT }}) for ${{ matrix.name }}"
            echo "Source: ${{ matrix.repo }} @ ${{ matrix.ref }}"
            echo ""
            echo "Gradle output tail:"
            echo '```'
            tail -c 60000 /tmp/build.log
            echo '```'
          } > lognotes.md
          gh release create "voxy-buildlog-${{ matrix.name }}-${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "BUILDLOG ${{ matrix.name }} (DRAFT)" \
            --notes-file lognotes.md

      - name: Publish jars as a DRAFT release (on success)
        if: env.GRADLE_EXIT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l voxy/build/libs
          sha256sum voxy/build/libs/*.jar
          {
            echo "Variant: ${{ matrix.name }}"
            echo "Source: ${{ matrix.repo }} @ ${{ matrix.ref }}"
            echo "${{ matrix.desc }}"
            echo "JDK 21, Minecraft 1.21.1, NeoForge."
            echo ""
            echo "Install: put the voxy-*.jar (without -sources/-dev suffix) into the instance mods folder."
            echo "Voxy is All Rights Reserved by MCRcortex. Private personal build: delete the draft after downloading."
          } > notes.md
          gh release create "voxy-${{ matrix.name }}-${GITHUB_RUN_ID}" voxy/build/libs/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Voxy NeoForge 1.21.1 - ${{ matrix.name }} (DRAFT)" \
            --notes-file notes.md
