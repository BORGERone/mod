name: Build Voxy NeoForge 1.21.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Voxy sources (PR #45 head)
        uses: actions/checkout@v4
        with:
          repository: j-shelfwood/voxy-neoforge
          ref: refs/pull/45/head
          path: voxy

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve Sodium + Iris jars into libs/
        working-directory: voxy
        run: |
          set -e
          mkdir -p libs
          exec > >(tee /tmp/probe.log) 2>&1
          has_cls() { unzip -l "$1" 2>/dev/null | grep -c 'net/caffeinemc/mods/sodium/client/gl/shader/ShaderParser.class' || true; }

          SOD_JSON=$(curl -sG 'https://api.modrinth.com/v2/project/sodium/version' \
            --data-urlencode 'game_versions=["1.21.1"]' --data-urlencode 'loaders=["neoforge"]')
          SOD_URL=$(echo "$SOD_JSON" | jq -r '[.[] | select(.version_number|test("0\\.8\\.13"))][0].files[0].url // empty')
          echo "modrinth sodium url: $SOD_URL"
          curl -sL -o /tmp/sodium-modrinth.jar "$SOD_URL"
          echo "outer jar ShaderParser=$(has_cls /tmp/sodium-modrinth.jar)"
          rm -rf /tmp/sodx && mkdir -p /tmp/sodx && (cd /tmp/sodx && unzip -oq /tmp/sodium-modrinth.jar)
          BEST=""
          for cand in $(find /tmp/sodx -name '*.jar' 2>/dev/null) /tmp/sodium-modrinth.jar; do
            c=$(has_cls "$cand"); echo "candidate $cand -> ShaderParser=$c"
            if [ "$c" -gt 0 ] && [ -z "$BEST" ]; then BEST="$cand"; fi
          done
          echo "BEST=$BEST"
          if [ -n "$BEST" ]; then cp "$BEST" 'libs/sodium-neoforge-0.8.12-beta.2-mod.jar'; else cp /tmp/sodium-modrinth.jar 'libs/sodium-neoforge-0.8.12-beta.2-mod.jar'; fi

          IRIS_JSON=$(curl -sG 'https://api.modrinth.com/v2/project/iris/version' \
            --data-urlencode 'game_versions=["1.21.1"]' --data-urlencode 'loaders=["neoforge"]')
          IRIS_URL=$(echo "$IRIS_JSON" | jq -r '[.[] | select(.version_number|test("1\\.8\\.14"))][0].files[0].url // empty')
          echo "iris url: $IRIS_URL"
          curl -sL -o 'libs/iris-neoforge-1.8.14-beta.1.jar' "$IRIS_URL"
          ls -l libs

      - name: Patch Iris pipeline handling (Immersive Portals fix)
        working-directory: voxy
        run: |
          set -e
          cat > /tmp/patch.py <<'PYEOF'
          import io, os, sys

          def patch(path, pairs):
              with io.open(path, encoding='utf-8') as f:
                  src = f.read()
              for old, new in pairs:
                  if old not in src:
                      print('!! PATTERN NOT FOUND in ' + path)
                      print(repr(old))
                      sys.exit(3)
                  src = src.replace(old, new, 1)
              with io.open(path, 'w', encoding='utf-8') as f:
                  f.write(src)
              print('patched ' + path)

          base = 'src/main/java/me/cortex/voxy/client/core/'

          old_factory = '''            Logger.info("Creating voxy iris render pipeline");
                      try {
                          return new IrisVoxyRenderPipeline(properties, pipeData, nodeManager, nodeCleaner, traversal, frexSupplier);
                      } catch (Exception e) {
                          Logger.error("Failed to create iris render pipeline", e);
                          IrisUtil.disableIrisShaders();
                          return null;
                      }'''

          new_factory = '''            if (pipeData.thePipeline != null) {
                          Logger.info("Iris pipeline data already bound by another voxy render system (secondary world / portal world switch) - using the normal pipeline for this instance, shaders stay enabled");
                          return null;
                      }
                      Logger.info("Creating voxy iris render pipeline");
                      try {
                          return new IrisVoxyRenderPipeline(properties, pipeData, nodeManager, nodeCleaner, traversal, frexSupplier);
                      } catch (Throwable e) {
                          Logger.error("Failed to create iris render pipeline - keeping shaders ENABLED, falling back to the normal pipeline", e);
                          pipeData.thePipeline = null;
                          return null;
                      }'''

          patch(base + 'RenderPipelineFactory.java', [(old_factory, new_factory)])

          old_field = '''    private final GlBuffer shaderUniforms;'''
          new_field = '''    private final GlBuffer shaderUniforms;
              private boolean voxyIrisPipelineFreed = false;'''

          old_free = '''    @Override
              public void free() {
                  if (this.data.thePipeline != this) {
                      throw new IllegalStateException();
                  }
                  this.data.thePipeline = null;'''

          new_free = '''    @Override
              public void free() {
                  if (this.voxyIrisPipelineFreed) {
                      return;
                  }
                  this.voxyIrisPipelineFreed = true;
                  if (this.data.thePipeline == this) {
                      this.data.thePipeline = null;
                  }'''

          patch(base + 'IrisVoxyRenderPipeline.java', [(old_field, new_field), (old_free, new_free)])

          # 3) MixinIrisRenderingPipeline: inject at HEAD (the activeTexture invoke point
          #    is gone in Iris 1.8.x) and restore the main render target viewport before
          #    applying captured parameters (shadow pass leaves a wrong GL viewport).
          old_begin = '''    @Inject(method = "beginLevelRendering", at = @At(value = "INVOKE", target = "Lcom/mojang/blaze3d/systems/RenderSystem;activeTexture(I)V", shift = At.Shift.BEFORE), remap = false)
              private void voxy$injectViewportSetup(CallbackInfo ci) {
                  if (IrisUtil.CAPTURED_VIEWPORT_PARAMETERS != null) {
                      var renderer = ((IGetVoxyRenderSystem) Minecraft.getInstance().levelRenderer).voxy$getRenderSystem();
                      if (renderer != null) {
                          IrisUtil.CAPTURED_VIEWPORT_PARAMETERS.apply(renderer);
                      }
                  }
              }'''

          new_begin = '''    @Inject(method = "beginLevelRendering", at = @At("HEAD"), remap = false)
              private void voxy$injectViewportSetup(CallbackInfo ci) {
                  if (IrisUtil.CAPTURED_VIEWPORT_PARAMETERS != null) {
                      var renderer = ((IGetVoxyRenderSystem) Minecraft.getInstance().levelRenderer).voxy$getRenderSystem();
                      if (renderer != null) {
                          var rt = Minecraft.getInstance().getMainRenderTarget();
                          org.lwjgl.opengl.GL11C.glViewport(0, 0, rt.width, rt.height);
                          IrisUtil.CAPTURED_VIEWPORT_PARAMETERS.apply(renderer);
                      }
                  }
              }'''

          patch(base + '../mixin/iris/MixinIrisRenderingPipeline.java', [(old_begin, new_begin)])

          # 4) MixinDefaultChunkRenderer: always setupViewport from doRender with the
          #    matrices of the CURRENT render pass (portal views get their own viewport
          #    instead of a stale one captured at renderLevel HEAD).
          old_dorender = '''                Viewport<?> viewport = null;
                          if (IrisUtil.irisShaderPackEnabled()) {
                              viewport = renderer.getViewport();
                          } else {
                              viewport = renderer.setupViewport(matrices.projection(), matrices.modelView(), camera.x, camera.y, camera.z);
                          }'''

          new_dorender = '''                Viewport<?> viewport = renderer.setupViewport(matrices.projection(), matrices.modelView(), camera.x, camera.y, camera.z);'''

          patch(base + '../mixin/sodium/MixinDefaultChunkRenderer.java', [(old_dorender, new_dorender)])

          # 5) ViewportSelector: do not render LOD into Iris shadow/G-buffer targets
          #    during the shadow pass (breaks the shadow map -> sunlight disappears);
          #    renderOpaque(null) is a safe no-op.
          old_shadow = '''        if (viewport == null && IrisUtil.irisShadowActive()) {
                      viewport = this.getOrCreate(IRIS_SHADOW_OBJECT);
                  }'''

          new_shadow = '''        if (viewport == null && IrisUtil.irisShadowActive()) {
                      return null;
                  }'''

          patch(base + 'rendering/ViewportSelector.java', [(old_shadow, new_shadow)])

          # 6) IrisVoxyRenderPipeline.finish(): snapshot/restore GL state. The depth blit
          #    leaves DEPTH_TEST/STENCIL_TEST/depth-func disabled or changed; Immersive
          #    Portals draws its portal quads right after and relies on sane state, so the
          #    leak made portals draw through walls and corrupted scene depth/lighting.
          old_finish = '''    @Override
              protected void finish(Viewport<?> viewport, int sourceFrameBuffer, int srcWidth, int srcHeight) {
                  if (this.data.renderToVanillaDepth && srcWidth == viewport.width  && srcHeight == viewport.height) {//We can only depthblit out if destination size is the same
                      glColorMask(false, false, false, false);
                      AbstractRenderPipeline.transformBlitDepth(this.depthBlit,
                              this.fbTranslucent.getDepthTex().id, sourceFrameBuffer,
                              viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));
                      glColorMask(true, true, true, true);
                  } else {
                      // normally disabled by AbstractRenderPipeline but since we are skipping it we do it here
                      glDisable(GL_STENCIL_TEST);
                      glDisable(GL_DEPTH_TEST);
                  }
              }'''

          new_finish = '''    @Override
              protected void finish(Viewport<?> viewport, int sourceFrameBuffer, int srcWidth, int srcHeight) {
                  int prevDepthFunc = org.lwjgl.opengl.GL11C.glGetInteger(org.lwjgl.opengl.GL11C.GL_DEPTH_FUNC);
                  boolean prevDepthTest = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_DEPTH_TEST);
                  boolean prevStencilTest = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_STENCIL_TEST);
                  boolean prevCullFace = org.lwjgl.opengl.GL11C.glIsEnabled(org.lwjgl.opengl.GL11C.GL_CULL_FACE);
                  try {
                      if (this.data.renderToVanillaDepth && srcWidth == viewport.width  && srcHeight == viewport.height) {//We can only depthblit out if destination size is the same
                          glColorMask(false, false, false, false);
                          AbstractRenderPipeline.transformBlitDepth(this.depthBlit,
                                  this.fbTranslucent.getDepthTex().id, sourceFrameBuffer,
                                  viewport, new Matrix4f(viewport.vanillaProjection).mul(viewport.modelView));
                          glColorMask(true, true, true, true);
                      } else {
                          // normally disabled by AbstractRenderPipeline but since we are skipping it we do it here
                          glDisable(GL_STENCIL_TEST);
                          glDisable(GL_DEPTH_TEST);
                      }
                  } finally {
                      if (prevDepthTest) {
                          glEnable(GL_DEPTH_TEST);
                      } else {
                          glDisable(GL_DEPTH_TEST);
                      }
                      if (prevStencilTest) {
                          glEnable(GL_STENCIL_TEST);
                      } else {
                          glDisable(GL_STENCIL_TEST);
                      }
                      if (prevCullFace) {
                          glEnable(GL_CULL_FACE);
                      } else {
                          glDisable(GL_CULL_FACE);
                      }
                      glDepthFunc(prevDepthFunc);
                  }
              }'''

          patch(base + 'IrisVoxyRenderPipeline.java', [(old_finish, new_finish)])

          # 7) PortalViewGuard + skip LOD draws while Immersive Portals renders a portal
          #    view (the user accepts LOD being invisible through portals).
          guard_path = base + 'util/PortalViewGuard.java'
          guard_src = '''package me.cortex.voxy.client.core.util;

          public class PortalViewGuard {
              private static final java.lang.reflect.Method IS_RENDERING = resolve();

              private static java.lang.reflect.Method resolve() {
                  String[] classNames = {
                          "qouteall.imm_ptl.core.render.context_management.PortalRendering",
                          "qouteall.imm_ptl.core.render.context_management.RenderStates"
                  };
                  String[] methodNames = { "isRendering", "isPortalRendering" };
                  for (String className : classNames) {
                      try {
                          Class<?> clazz = Class.forName(className);
                          for (String methodName : methodNames) {
                              try {
                                  return clazz.getMethod(methodName);
                              } catch (NoSuchMethodException ignored) {
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  return null;
              }

              public static boolean isRenderingPortalView() {
                  if (IS_RENDERING == null) {
                      return false;
                  }
                  try {
                      return (Boolean) IS_RENDERING.invoke(null);
                  } catch (Throwable t) {
                      return false;
                  }
              }
          }
          '''
          os.makedirs(os.path.dirname(guard_path), exist_ok=True)
          with io.open(guard_path, 'w', encoding='utf-8') as f:
              f.write(guard_src)
          print('wrote ' + guard_path)

          old_dorender_head = '''    private void doRender(ChunkRenderMatrices matrices, TerrainRenderPass renderPass, CameraTransform camera) {
                  if (renderPass == DefaultTerrainRenderPasses.CUTOUT) {'''

          new_dorender_head = '''    private void doRender(ChunkRenderMatrices matrices, TerrainRenderPass renderPass, CameraTransform camera) {
                  if (me.cortex.voxy.client.core.util.PortalViewGuard.isRenderingPortalView()) {
                      return;
                  }
                  if (renderPass == DefaultTerrainRenderPasses.CUTOUT) {'''

          patch(base + '../mixin/sodium/MixinDefaultChunkRenderer.java', [(old_dorender_head, new_dorender_head)])

          # 8) build marker so the running jar can be identified from the log
          old_marker = '''        //Note this is where will choose/create e.g. IrisRenderPipeline or normal pipeline
                  AbstractRenderPipeline pipeline = null;'''

          new_marker = '''        Logger.info("arena build marker: iris-ipfix-v4 (secondary-renderer guard)");
                  //Note this is where will choose/create e.g. IrisRenderPipeline or normal pipeline
                  AbstractRenderPipeline pipeline = null;'''

          patch(base + 'RenderPipelineFactory.java', [(old_marker, new_marker)])

          # 9) MixinLevelRenderer: Immersive Portals creates a SECONDARY LevelRenderer per
          #    portal world. Both renderers fight for the single IrisVoxyRenderPipelineData
          #    slot, so one of them silently falls back to NormalRenderPipeline (gray/unlit
          #    LOD, its own depth blits) and uniform updates go to the wrong instance
          #    (smeared LOD). Voxy must only run on the primary LevelRenderer.
          old_import = '''import net.minecraft.client.multiplayer.ClientLevel;'''
          new_import = '''import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;'''

          old_create = '''    public void voxy$createRenderer() {
                  if (this.renderer != null) throw new IllegalStateException("Cannot have multiple renderers");'''

          new_create = '''    public void voxy$createRenderer() {
                  if ((LevelRenderer) (Object) this != Minecraft.getInstance().levelRenderer) {
                      Logger.info("Skipping voxy renderer: secondary (Immersive Portals) world renderer");
                      return;
                  }
                  if (this.renderer != null) throw new IllegalStateException("Cannot have multiple renderers");'''

          old_catch = '''        } catch (RuntimeException e) {
                      if (IrisUtil.irisShaderPackEnabled()) {
                          IrisUtil.disableIrisShaders();
                      } else {
                          throw e;
                      }
                  }'''

          new_catch = '''        } catch (RuntimeException e) {
                      Logger.error("Failed to create voxy render system - keeping shaders ENABLED", e);
                      this.renderer = null;
                  }'''

          mlr = base + '../mixin/minecraft/MixinLevelRenderer.java'
          patch(mlr, [(old_import, new_import), (old_create, new_create), (old_catch, new_catch)])
          PYEOF
          python3 /tmp/patch.py
          echo "=== diff ==="
          git --no-pager diff --stat
          git --no-pager diff | tee /tmp/patch.diff | head -120

      - name: Gradle build (capture log)
        working-directory: voxy
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          echo "gradle exit code: $code"

      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "gradle exit: ${{ env.GRADLE_EXIT }}"
            echo ""
            echo "== applied patch =="
            echo '```diff'
            head -c 20000 /tmp/patch.diff
            echo '```'
            echo ""
            echo "== compile errors =="
            echo '```'
            grep -aE "error:|FAILURE|What went wrong|Execution failed|Could not resolve|> Task .* FAILED" /tmp/build.log | head -40
            echo '```'
            echo ""
            echo "== probe (libs/) =="
            echo '```'
            head -c 4000 /tmp/probe.log
            echo '```'
          } > notes.md
          if [ "${{ env.GRADLE_EXIT }}" = "0" ]; then
            ls -l voxy/build/libs
            sha256sum voxy/build/libs/*.jar | tee /tmp/sha.txt
            printf '\n== checksums ==\n```\n' >> notes.md
            cat /tmp/sha.txt >> notes.md
            printf '```\n' >> notes.md
            gh release create "voxy-pr45-iris-ipfix-${GITHUB_RUN_ID}" voxy/build/libs/*.jar \
              --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Voxy 0.2.15-beta NeoForge + Iris (IP fix) (DRAFT)" --notes-file notes.md
          else
            gh release create "voxy-buildlog-ipfix-${GITHUB_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" --draft \
              --title "BUILDLOG ipfix (DRAFT)" --notes-file notes.md
          fi
