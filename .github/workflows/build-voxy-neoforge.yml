name: Build Voxy NeoForge 1.21.1

on:
  push:
    branches: ['arena/94d4d401-mod']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pr45-sodium0812-iris
            repo: j-shelfwood/voxy-neoforge
            ref: refs/pull/45/head
            desc: "PR #45: voxy 0.2.15-beta + Sodium 0.8.12 + Iris 1.8.14 (all 11 iris mixins active)"
          - name: pr38-iris-sodium0613
            repo: j-shelfwood/voxy-neoforge
            ref: refs/pull/38/head
            desc: "PR #38: Iris 1.8.1 shader integration, Sodium 0.6.13 baseline"
          - name: irisfork-sodium0613
            repo: TheNofis/voxy-neoforge-iris-support
            ref: neoforge-1.21.1
            desc: "TheNofis iris-support fork, Sodium 0.6.13 baseline"
    steps:
      - name: Checkout Voxy sources
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: voxy

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle build
        working-directory: voxy
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain --stacktrace
        env:
          GITHUB_ACTIONS: true

      - name: Show built jars
        run: |
          ls -l voxy/build/libs
          sha256sum voxy/build/libs/*.jar

      - name: Publish jars as a DRAFT release (not public until published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Variant: ${{ matrix.name }}"
            echo "Source: ${{ matrix.repo }} @ ${{ matrix.ref }}"
            echo "${{ matrix.desc }}"
            echo "JDK 21, Minecraft 1.21.1, NeoForge."
            echo ""
            echo "pr45 variant: Sodium 0.8.12+ and Iris 1.8.14 (LOD renders under shaderpacks)."
            echo "pr38 / irisfork variants: Sodium 0.6.13-neoforge and Iris 1.8.1 only."
            echo "Also needs Forgified Fabric API."
            echo "Install: put the voxy-*.jar (without -sources/-dev suffix) into the instance mods folder."
            echo ""
            echo "Voxy is All Rights Reserved by MCRcortex. Private personal build: delete the draft after downloading."
          } > notes.md
          gh release create "voxy-${{ matrix.name }}-${GITHUB_RUN_ID}" voxy/build/libs/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Voxy NeoForge 1.21.1 - ${{ matrix.name }} (DRAFT)" \
            --notes-file notes.md
