name: Build Voxy NeoForge 1.21.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe-and-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Voxy sources (PR #45 head)
        uses: actions/checkout@v4
        with:
          repository: j-shelfwood/voxy-neoforge
          ref: refs/pull/45/head
          path: voxy

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve real Sodium classes + Iris jar into libs/
        working-directory: voxy
        run: |
          set -e
          mkdir -p libs
          exec > >(tee /tmp/probe.log) 2>&1

          has_cls() { unzip -l "$1" 2>/dev/null | grep -c 'net/caffeinemc/mods/sodium/client/gl/shader/ShaderParser.class' || true; }

          SOD_JSON=$(curl -sG 'https://api.modrinth.com/v2/project/sodium/version' \
            --data-urlencode 'game_versions=["1.21.1"]' --data-urlencode 'loaders=["neoforge"]')
          SOD_URL=$(echo "$SOD_JSON" | jq -r '[.[] | select(.version_number|test("0\\.8\\.13"))][0].files[0].url // empty')
          echo "modrinth sodium url: $SOD_URL"
          curl -sL -o /tmp/sodium-modrinth.jar "$SOD_URL"
          echo "modrinth jar: $(ls -l /tmp/sodium-modrinth.jar | awk '{print $5}') bytes, ShaderParser=$(has_cls /tmp/sodium-modrinth.jar)"

          echo "== full listing of the modrinth sodium jar =="
          unzip -l /tmp/sodium-modrinth.jar | head -140

          echo "== nested jars inside =="
          unzip -l /tmp/sodium-modrinth.jar | grep -aE '\.jar$' || echo "(none)"

          echo "== urls referenced inside the jar =="
          rm -rf /tmp/sodx && mkdir -p /tmp/sodx && (cd /tmp/sodx && unzip -oq /tmp/sodium-modrinth.jar)
          find /tmp/sodx -type f \( -name '*.class' -o -name '*.json' -o -name '*.toml' -o -name '*.properties' \) -print0 \
            | xargs -0 cat 2>/dev/null | strings | grep -aoE 'https?://[A-Za-z0-9./_%?=&-]+' | sort -u | head -30

          echo "== mods.toml / manifest of the thin jar =="
          for f in META-INF/neoforge.mods.toml META-INF/MANIFEST.MF META-INF/jarjar/metadata.json; do
            echo "--- $f"; cat "/tmp/sodx/$f" 2>/dev/null | head -40 || echo "(missing)"
          done

          echo "== try caffeinemc maven =="
          for u in \
            'https://maven.caffeinemc.net/net/caffeinemc/sodium/maven-metadata.xml' \
            'https://maven.caffeinemc.net/net/caffeinemc/sodium/sodium-neoforge/maven-metadata.xml' \
            'https://maven.caffeinemc.net/' ; do
            echo "--- $u"; curl -s -m 25 "$u" | head -30
          done

          echo "== pick the best sodium jar for compilation =="
          BEST=""
          for cand in $(find /tmp/sodx -name '*.jar' 2>/dev/null) /tmp/sodium-modrinth.jar; do
            c=$(has_cls "$cand")
            echo "candidate $cand -> ShaderParser=$c"
            if [ "$c" -gt 0 ] && [ -z "$BEST" ]; then BEST="$cand"; fi
          done
          echo "BEST=$BEST"
          if [ -n "$BEST" ]; then cp "$BEST" 'libs/sodium-neoforge-0.8.12-beta.2-mod.jar'; else cp /tmp/sodium-modrinth.jar 'libs/sodium-neoforge-0.8.12-beta.2-mod.jar'; fi

          IRIS_JSON=$(curl -sG 'https://api.modrinth.com/v2/project/iris/version' \
            --data-urlencode 'game_versions=["1.21.1"]' --data-urlencode 'loaders=["neoforge"]')
          IRIS_URL=$(echo "$IRIS_JSON" | jq -r '[.[] | select(.version_number|test("1\\.8\\.14"))][0].files[0].url // empty')
          echo "iris url: $IRIS_URL"
          curl -sL -o 'libs/iris-neoforge-1.8.14-beta.1.jar' "$IRIS_URL"

          echo "== final libs/ =="
          ls -l libs
          for f in libs/*.jar; do echo "--- $f entries=$(unzip -l "$f" | tail -1) ShaderParser=$(has_cls "$f")"; done

      - name: Gradle build (capture log)
        working-directory: voxy
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --console=plain --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$code" >> "$GITHUB_ENV"
          echo "gradle exit code: $code"

      - name: Publish result (jar on success, log on failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "gradle exit: ${{ env.GRADLE_EXIT }}"
            echo ""
            echo "== PROBE =="
            echo '```'
            head -c 45000 /tmp/probe.log
            echo '```'
            echo ""
            echo "== compile errors =="
            echo '```'
            grep -aE "error:|FAILURE|What went wrong|Execution failed|Could not resolve|> Task .* FAILED" /tmp/build.log | head -40
            echo '```'
          } > lognotes.md
          if [ "${{ env.GRADLE_EXIT }}" = "0" ]; then
            ls -l voxy/build/libs
            sha256sum voxy/build/libs/*.jar | tee /tmp/sha.txt
            printf '\n== checksums ==\n```\n' >> lognotes.md
            cat /tmp/sha.txt >> lognotes.md
            printf '```\n' >> lognotes.md
            gh release create "voxy-pr45-iris-${GITHUB_RUN_ID}" voxy/build/libs/*.jar \
              --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Voxy 0.2.15-beta NeoForge + Iris (DRAFT)" --notes-file lognotes.md
          else
            gh release create "voxy-buildlog-probe-${GITHUB_RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" --draft \
              --title "BUILDLOG probe pr45 (DRAFT)" --notes-file lognotes.md
          fi
