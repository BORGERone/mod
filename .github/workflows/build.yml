name: Build mod jar

# Builds on every push to the port branch and on manual dispatch.
# The resulting jar is uploaded as the "nomansland-jar" artifact.
on:
  push:
    branches: [arena/b7115d06-mod]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build log summary
        if: always()
        run: |
          {
            echo '## Gradle build (last 120 lines)'
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo 'no build.log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the useful lines as annotations (readable via the API when raw logs are unreachable)
          grep -nE "error:|FAILED|Execution failed|What went wrong|Caused by|Could not (resolve|find)|Could not GET" build.log 2>/dev/null | head -n 40 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error::${esc}"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nomansland-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Direct artifact download is not reachable from every dev environment,
      # so the jar is also committed to dist/ on the same branch.
      # "[skip ci]" in the message prevents an endless build loop.
      - name: Commit jar to dist/
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "Jar unchanged, nothing to commit"
          else
            git commit -m "CI: built jar [skip ci]"
            git push
          fi
