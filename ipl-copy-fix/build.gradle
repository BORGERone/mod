plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

group = 'arena'
version = '1.0.0'

base {
    archivesName = 'ipl-copy-fix'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version
}

repositories {
    mavenCentral()
}
