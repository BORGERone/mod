<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 248px;
      margin: 0;
      padding: 12px 14px 14px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0 0 2px;
      font-size: 13px;
      font-weight: 600;
    }
    #host {
      margin: 0 0 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      opacity: 0.65;
      overflow-wrap: anywhere;
    }
    label.main {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      cursor: pointer;
      user-select: none;
    }
    label.main input { margin: 2px 0 0; }
    #row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 10px 0 0 22px;
      opacity: 1;
      transition: opacity 0.12s;
    }
    #row[data-off="1"] { opacity: 0.4; pointer-events: none; }
    #row input[type="number"] { width: 64px; padding: 3px 5px; }
    #notice {
      margin: 10px 0 0;
      font-size: 11.5px;
      opacity: 0.6;
    }
    #notice:empty { display: none; }
  </style>
</head>
<body>
  <h1>Отступ снизу</h1>
  <p id="host">…</p>

  <label class="main">
    <input type="checkbox" id="toggle">
    <span>добавлять на этом сайте</span>
  </label>

  <div id="row" data-off="1">
    <input type="number" id="px" min="1" max="300" step="1" value="20">
    <span>px</span>
  </div>

  <p id="notice"></p>

  <script src="popup.js"></script>
</body>
</html>
