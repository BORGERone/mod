<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 264px;
      margin: 0;
      padding: 12px 14px 14px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0 0 2px;
      font-size: 13px;
      font-weight: 600;
    }
    #host {
      margin: 0 0 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      opacity: 0.65;
      overflow-wrap: anywhere;
    }
    label.main {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      cursor: pointer;
      user-select: none;
    }
    label.main input { margin: 2px 0 0; flex: none; }
    label.main span small {
      display: block;
      font-size: 11px;
      opacity: 0.55;
      line-height: 1.3;
      margin-top: 1px;
    }
    #row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 10px 0 0 22px;
      transition: opacity 0.12s;
    }
    #row[data-off="1"], #stripRow[data-off="1"] { opacity: 0.4; pointer-events: none; }
    #stripRow { margin: 8px 0 0 22px; }
    #row input[type="number"] { width: 64px; padding: 3px 5px; }
    #liftRow {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(128, 128, 128, 0.28);
      transition: opacity 0.12s;
    }
    #liftRow[data-off="1"] { opacity: 0.4; pointer-events: none; }
    #notice {
      margin: 10px 0 0;
      font-size: 11.5px;
      opacity: 0.6;
    }
    #notice:empty { display: none; }
  </style>
</head>
<body>
  <h1>Отступ снизу</h1>
  <p id="host">…</p>

  <label class="main">
    <input type="checkbox" id="toggle">
    <span>добавлять на этом сайте</span>
  </label>

  <div id="row" data-off="1">
    <input type="number" id="px" min="1" max="300" step="1" value="26">
    <span>px</span>
  </div>

  <div id="stripRow" data-off="1">
    <label class="main">
      <input type="checkbox" id="strip">
      <span>покрасить полосу
        <small>отступ станет видимым: страница закончится на 20px выше</small>
      </span>
    </label>
  </div>

  <div id="liftRow" data-off="1">
    <label class="main">
      <input type="checkbox" id="lift">
      <span>поднять нижние панели
        <small>плееры и док-бары, приклеенные к низу окна (position: fixed)</small>
      </span>
    </label>
  </div>

  <p id="notice"></p>

  <script src="popup.js"></script>
</body>
</html>
